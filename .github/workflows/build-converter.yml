name: Build HTML2APK Converter

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-converter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже есть на ubuntu-latest. android-actions/setup-android@v3
      # больше не работает (пакет "tools" удалён из репозитория Google), поэтому
      # нужные пакеты доставляем напрямую через sdkmanager.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/11.0/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKM="$candidate"; break; fi
          done
          if [ -z "$SDKM" ]; then
            echo "sdkmanager не найден - используем предустановленный SDK"
          elif [ ! -d "$SDK_ROOT/platforms/android-34" ] || [ ! -d "$SDK_ROOT/build-tools/34.0.0" ]; then
            # yes обрывает пайп по SIGPIPE => возвращаем 0 через subshell + || true
            ( yes | "$SDKM" --sdk_root="$SDK_ROOT" --install \
              "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null ) || true
          else
            echo "platforms;android-34 и build-tools;34.0.0 уже установлены"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 1) Сначала собираем минимальный WebView-шаблон (module :template-webview)
      - name: Build template-webview (template.apk)
        run: gradle :template-webview:assembleRelease --no-daemon --stacktrace

      - name: Show template APK
        run: ls -la template-webview/build/outputs/apk/release/

      # 2) JVM-smoke-тест: на реальном template.apk прогоняем патч AXML,
      #    патч resources.arsc, выравнивание ZIP и подпись apksig v1+v2.
      - name: Smoke test (AXML + ARSC + zipalign + apksig)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Verify patched APK (zipalign / apksigner / aapt2)
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/34.0.0"
          ls -la app/build/smoke/
          echo "=== zipalign -c (4) ==="
          "$BT/zipalign" -c -v 4 app/build/smoke/aligned.apk | tail -3
          echo "=== apksigner verify ==="
          "$BT/apksigner" verify --verbose --print-certs app/build/smoke/signed.apk
          echo "=== aapt2 dump badging ==="
          "$BT/aapt2" dump badging app/build/smoke/signed.apk > /tmp/badging.txt || true
          head -8 /tmp/badging.txt

      - name: Upload smoke APK (для проверки установки на телефоне)
        uses: actions/upload-artifact@v4
        with:
          name: smoke-signed-apk
          path: app/build/smoke/signed.apk
          if-no-files-found: error

      # 3) Генерируем ключ подписи для самого конвертера
      - name: Create signing keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'html2apk-converter' }}
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.jks" \
            -alias html2apk \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=HTML2APK Converter, O=HTML2APK, C=US"

      # 4) Собираем само приложение-конвертер (:app).
      #    Задача copyTemplateApk кладёт template-webview-release-unsigned.apk
      #    в app/src/main/assets/template.apk (через generated assets).
      - name: Build converter APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'html2apk-converter' }}
          RELEASE_KEY_ALIAS: html2apk
          RELEASE_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'html2apk-converter' }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/HTML2APK-Converter.apk"
          cp template-webview/build/outputs/apk/release/template-webview-release-unsigned.apk "out/template.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTML2APK-Converter
          path: out/HTML2APK-Converter.apk
          if-no-files-found: error

      - name: Upload template APK artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: template-webview-unsigned
          path: out/template.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HTML2APK Converter v1.0.${{ github.run_number }}
          files: out/HTML2APK-Converter.apk
          body: |
            Автосборка конвертера HTML/CSS/JS → APK.

            * `template-webview` собран первым и упакован в `assets/template.apk`
            * `:app` собран и подписан (RSA-2048)
            * Установка: скачайте `HTML2APK-Converter.apk` на телефон и разрешите установку из этого источника
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
